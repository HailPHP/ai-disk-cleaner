name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  go-format:
    name: Go format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if ((${#go_files[@]} == 0)); then
            exit 0
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            gofmt -w "${go_files[@]}"
            git diff --binary > go-formatting.patch
            exit 1
          fi

      - name: Upload Go formatting diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-formatting-diff
          path: go-formatting.patch
          if-no-files-found: ignore

  go-test:
    name: Go tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        working-directory: frontend
        run: pnpm lint && pnpm check && pnpm build

      - name: Format Go source
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          gofmt -w $files

      - name: Run Go tests
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build portable Windows executable
        run: wails build -platform windows/amd64 -trimpath -o ai-disk-cleaner-windows-amd64.exe

      - name: Smoke test Windows startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/bin/ai-disk-cleaner-windows-amd64.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Application exited during startup with code $($process.ExitCode)"
            }
            'Windows process remained running after startup; no disk scan or cleanup was started.' |
              Set-Content 'build/bin/startup-smoke.txt' -Encoding utf8
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = 'build/bin/ai-disk-cleaner-windows-amd64.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ai-disk-cleaner-windows-amd64.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ai-disk-cleaner-windows-amd64
          path: |
            build/bin/ai-disk-cleaner-windows-amd64.exe
            build/bin/ai-disk-cleaner-windows-amd64.exe.sha256
            build/bin/startup-smoke.txt
            docs/responses-api.md
          if-no-files-found: error

      - name: Save formatting diff
        if: always()
        shell: pwsh
        run: |
          python -c "import subprocess; f=open('formatting.patch','wb'); subprocess.run(['git','diff','--binary'],stdout=f,check=True); f.close()"

      - name: Upload formatting diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diff
          path: formatting.patch

      - name: Require clean source after formatting
        run: git diff --exit-code

